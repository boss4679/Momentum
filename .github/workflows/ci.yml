# Runs on every push and pull request. Three independent jobs, so a lint failure doesn't
# hide a test failure (and they run in parallel).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The oldest Node version the project supports (see "engines" in each package.json).
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  server:
    name: Server tests (Postgres 16)
    runs-on: ubuntu-latest
    # A real Postgres, like local development: the tests check constraints, transactions
    # and SQL, which a mock can't.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://momentum:momentum@localhost:5432/momentum_test
      TEST_DATABASE_URL: postgres://momentum:momentum@localhost:5432/momentum_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Jest's globalSetup applies the migrations before the first test file runs.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
